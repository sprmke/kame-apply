[project]
name = "kame-agent"
version = "0.1.0"
description = "Run your own Claude against Kame Apply MCP (never stores Claude credentials)."
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "typer>=0.12"]

[project.scripts]
kame-agent = "kame_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kame_agent"]

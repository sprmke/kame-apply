name: kame-apply-dev

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: kame_apply
      POSTGRES_PASSWORD: kame_apply_local_only
      POSTGRES_DB: kame_apply
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kame_apply -d kame_apply"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9101"
    environment:
      MINIO_ROOT_USER: kame_apply
      MINIO_ROOT_PASSWORD: kame_apply_local_only
    ports:
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9101"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1125:1025"
      - "127.0.0.1:8125:8025"

volumes:
  pgdata:
  miniodata:

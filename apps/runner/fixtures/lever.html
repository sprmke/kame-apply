<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lever fixture</title>
  </head>
  <body>
    <h1>Acme — Software Engineer</h1>
    <form>
      <label for="name">Full name</label>
      <input id="name" name="name" type="text" required />

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required />

      <label for="phone">Phone</label>
      <input id="phone" name="phone" type="tel" />

      <label for="urls">LinkedIn URL</label>
      <input id="urls" name="urls[LinkedIn]" type="url" />

      <label for="resume-upload">Resume</label>
      <input id="resume-upload" name="resume" type="file" />

      <label for="comments">Additional information</label>
      <textarea id="comments" name="comments"></textarea>

      <button type="submit">Submit application</button>
    </form>
  </body>
</html>

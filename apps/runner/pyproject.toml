[project]
name = "kame-apply-runner"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "kame-apply-core",
  "httpx>=0.28",
  "playwright>=1.49",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "websockets>=14.0",
]

[project.scripts]
kame-runner = "runner.main:main"

[tool.uv.sources]
kame-apply-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runner"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]

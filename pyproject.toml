[project]
name = "kame-apply-workspace"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = []

[tool.uv.workspace]
members = ["apps/api", "apps/runner", "packages/py-core"]

[dependency-groups]
dev = [
  "ruff>=0.9",
  "basedpyright>=1.28",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "httpx>=0.28",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["apps/api/migrations/versions", "spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
# E501: the formatter owns line length (long SQL/strings are fine). S101: asserts in tests.
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"packages/kame-agent/**" = ["S603", "S607"]
"**/tests/**" = ["S105", "S106"]

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["apps/api/app", "apps/api/tests", "packages/py-core"]
exclude = ["**/.venv", "apps/api/migrations"]
reportMissingTypeStubs = false

[tool.ruff.lint.isort]
known-first-party = ["app", "kame_core", "runner", "tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["app.core.security.require_action", "fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.Path"]
